# The suite against a fresh resolve of the dependencies, weekly and on demand.
#
# Every other job installs requirements.lock exactly, so every machine tests
# the same versions -- which also means nothing tests what `pip install
# schwaby` resolves today. That is where authlib 1.9 changing the exception it
# raises for a refusal with no JSON body was found. A failure here is a reason
# to look at the newest releases and update the lock, not a broken build.
name: fresh resolve

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Pinned Python ${{ matrix.python }}
      id: pin
      shell: bash
      run: |
        version=$(tr -d '\r' < .python-versions | grep -E "^${MINOR//./\\.}\.[0-9]+$") || {
          echo "no pin for $MINOR in .python-versions"; exit 1; }
        echo "version=$version" >> "$GITHUB_OUTPUT"
      env:
        MINOR: ${{ matrix.python }}
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0: setup-uv publishes no floating major tag
      with:
        version: "0.13.4"
        python-version: ${{ steps.pin.outputs.version }}
        activate-environment: true
    # No -c requirements.lock: the newest of everything setup.py allows.
    - name: Install dependencies
      run: uv pip install ".[dev]"
    - name: What resolved
      run: uv pip freeze
    - name: Test
      run: python -m pytest tests/ -q
