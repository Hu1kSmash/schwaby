# Publishes to PyPI on a GitHub Release, using trusted publishing.
#
# There is no API token anywhere in this repository or in its secrets. GitHub
# mints a short-lived OIDC token for this workflow and PyPI verifies it against
# the publisher you configured, so there is no long-lived credential to leak,
# rotate or forget. That is the whole reason `id-token: write` is here.
#
# It runs on a published Release rather than on a tag push, so pushing a tag by
# itself never publishes. Creating the release is the deliberate act.
name: publish

on:
  release:
    types: [published]
  # Lets a failed publish be retried without cutting another release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The tests run again here rather than trusting the run on the commit. A
  # release can be created from a tag whose test run is old, was skipped, or
  # passed before a force-push -- and "it was green earlier" is not the same
  # claim as "it is green now".
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      # The exact build .python-versions pins for this minor version, which
      # uv downloads and checks the hash of: the build every machine that
      # runs this suite runs. A minor version with no pin fails here, by name.
      - name: Pinned Python ${{ matrix.python }}
        id: pin
        shell: bash
        run: |
          version=$(tr -d '\r' < .python-versions | grep -E "^${MINOR//./\\.}\.[0-9]+$") || {
            echo "no pin for $MINOR in .python-versions"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          MINOR: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.4"
          python-version: ${{ steps.pin.outputs.version }}
          activate-environment: true
      - name: The interpreter is the pinned build
        shell: bash
        run: >-
          python -c "import platform, sys; v = platform.python_version();
          sys.exit(0 if v == sys.argv[1] else 'running %s, pinned %s' % (v, sys.argv[1]))"
          ${{ steps.pin.outputs.version }}
      - run: uv pip install -c requirements.lock ".[dev]"
      - run: pytest tests/ -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Pinned Python "3.12"
        id: pin
        shell: bash
        run: |
          version=$(tr -d '\r' < .python-versions | grep -E "^${MINOR//./\\.}\.[0-9]+$") || {
            echo "no pin for $MINOR in .python-versions"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          MINOR: "3.12"
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.4"
          python-version: ${{ steps.pin.outputs.version }}
          activate-environment: true
      - name: The interpreter is the pinned build
        shell: bash
        run: >-
          python -c "import platform, sys; v = platform.python_version();
          sys.exit(0 if v == sys.argv[1] else 'running %s, pinned %s' % (v, sys.argv[1]))"
          ${{ steps.pin.outputs.version }}
      # readme_renderer[md] is not optional. Measured: with a markdown
      # long_description and without that extra, `twine check --strict` prints
      # PASSED for both artifacts having rendered nothing -- it warns on import
      # and moves on. So the gate does not fail loudly when it stops working,
      # it just stops working.
      - run: uv pip install -c requirements.lock build twine "readme_renderer[md]"
      - run: python -m build

      # twine check verifies the long_description renders at all. Note it is a
      # much weaker gate for markdown than it was for rst: measured, it rejects
      # only an empty or whitespace-only document, where rst also rejected
      # malformed markup. The real check is the suite's
      # test_the_readme_renders_to_a_real_page, which asserts the rendered HTML
      # is substantial and contains what a PyPI page has to carry. Both run.
      - run: python -m twine check --strict dist/*

      # The version in the artifact must match the tag being released.
      # Publishing 2.5.1 from a tag called v2.6.0 is not recoverable: PyPI
      # refuses re-uploads of a version, so the wrong number is permanent.
      - name: Version must match the tag
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(ls dist/*.tar.gz | sed -E 's/.*schwaby-(.*)\.tar\.gz/\1/')
          echo "tag=$tag built=$built"
          test "$tag" = "$built"

      # upload-artifact and download-artifact are versioned separately and
      # their majors are offset by one from v5 onward -- download picked up an
      # extra breaking change that upload did not. The pair that goes together
      # is the one released on the same day: upload v7 with download v8. Bump
      # both or neither. Dependabot opens a pull request per action and will
      # happily offer you half of this.
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for trusted publishing; nothing else
    steps:
      - uses: actions/download-artifact@v8   # pairs with upload v7 above
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
