# The exact dependency set this project's suite is tested against. The
# shared test queue applies it as PIP_CONSTRAINT, so every machine there
# tests the same versions. It is not what schwaby requires: setup.py's
# floors are that, and installing schwaby never reads this file.
#
# Resolved 2026-10-23 on Python 3.14.6 by `pip install '.[dev]'` in a
# fresh virtualenv. The runtime packages are the set 5.1.0 was certified
# against on 2026-10-22. httpx2 2.16 needs Python 3.11 or newer, so this
# does not install on 3.10, which CI tests without it.
#
# To regenerate: pip install '.[dev]' in a fresh virtualenv, then
# pip freeze --all, leaving out pip and schwaby itself.
