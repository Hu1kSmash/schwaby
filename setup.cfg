[metadata]
license_files = LICENSE

[tool:pytest]
python_files = *test*.py
testpaths = tests
norecursedirs=schwaby build dist docs htmlcov

# `pytest tests/ -n auto` runs the suite on every core, and this is what makes
# that safe. Every test which runs the login flow starts a real callback server
# on the port its URL names, in a child process, so the test cannot hold the
# port -- only name it. Two of those on different workers collide, and the
# loser is worse than failed: its readiness probe finds the other worker's
# server, which answers the same status path, so it waits out the whole
# five-minute callback timeout. `callback_port_group` in tests/utils.py puts
# them all on one worker, and xdist honours that only under `loadgroup`. The
# default `load` happened to place them together and was clean in 50 runs,
# by collection order alone; `loadfile` and `loadscope` collided in 7 of 20.
# Without `-n` this changes nothing and the suite runs in one process.
addopts = --dist loadgroup

# Every test has a limit, and one that passes it fails by name instead of
# hanging the run. The whole suite takes about 15 seconds in one process, so a
# minute for one test is generous. The case it exists for: a login-flow test
# that loses port 6969 to another copy of the suite waits out the flow's
# five-minute callback timeout, and without a limit that reads as a slow run
# rather than a failure.
timeout = 60

# A helper named `test_*` is collected by pytest, called, and passes -- a test
# that tests nothing, which is the worst kind because it reports green and
# raises the count. `test_files()` was added as a helper on DocExampleTest and
# did exactly that. unittest already warns when a collected test returns a
# value; this makes that warning fail the run, which is the only way anyone
# reads it.
filterwarnings =
    error:It is deprecated to return a value that is not None from a test case

[coverage:run]
branch = True

[coverage:report]
# Two decimal places, because the floor below is compared against whatever this
# prints. At the default precision everything from 96.5 to 97.4 displays as
# `97`, so a floor of 97 is really a floor of 96.5 and the number in this file
# would not mean what it says.
precision = 2

# A floor, not a target. This project's own record is that coverage does not
# find its defects -- every one found so far was in code with 100% line
# coverage -- so the number is not evidence of anything and chasing it is a
# waste. What it does catch, and nothing else here does, is a body of new code
# arriving with no tests at all.
#
# Chosen by measuring rather than by rounding, and re-measured whenever the
# figure moves -- a calibration comment that no longer describes the tree
# sends the next person recalibrating from a wrong baseline.
#
# Measured at 99.31%: adding untested statements to the package moves the
# total +0 -> 99.31%, +40 -> 98.70%, +100 -> 97.82%. The platforms disagree
# slightly, since they do not execute quite the same lines -- the spread was
# about 0.2 points when this was last checked across Linux, Windows and macOS.
#
# So 97.5 leaves room for roughly 120 untested statements. That is looser than
# it was, deliberately: the floor is here to catch a body of new code arriving
# with no tests, not to ratchet upward every time coverage improves, and a
# floor that tracks the current number turns every ordinary change into a
# negotiation with this file. Raise it when it stops catching that.
fail_under = 97.5

# Keep this list to lines that actually occur. `except ImportError`,
# `def __repr__`, `raise DeprecationWarning` and `deprecate` were all here and
# matched nothing in schwaby/ -- the first of those is the one that matters,
# since it would silently drop any future ImportError handler out of coverage.
exclude_lines =
    pragma: no cover
    raise NotImplementedError
