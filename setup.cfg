[metadata]
license_files = LICENSE

[tool:pytest]
python_files = *test*.py
testpaths = tests
norecursedirs=schwaby build dist docs htmlcov

[coverage:run]
branch = True

[coverage:report]
# Two decimal places, because the floor below is compared against whatever this
# prints. At the default precision everything from 96.5 to 97.4 displays as
# `97`, so a floor of 97 is really a floor of 96.5 and the number in this file
# would not mean what it says.
precision = 2

# A floor, not a target. This project's own record is that coverage does not
# find its defects -- every one found so far was in code with 100% line
# coverage -- so the number is not evidence of anything and chasing it is a
# waste. What it does catch, and nothing else here does, is a body of new code
# arriving with no tests at all.
#
# Chosen by measuring rather than by rounding. Adding untested statements to
# the package moves the total like this: +0 -> 98.40%, +20 -> 98.10%,
# +50 -> 97.65%, +100 -> below 97. And the platforms disagree slightly, since
# they do not execute quite the same lines: 32 statements missed on Linux, 35
# on Windows, 36 on macOS, which puts the worst of them near 98.2%.
#
# So 97.5 clears the worst platform by about three quarters of a point, which
# is roughly fifty untested statements -- enough room for ordinary work, and
# not enough for a new module to arrive with no tests behind it. A floor set
# at the measured number instead would fail on whichever runner happens to
# execute one line fewer.
fail_under = 97.5

# Keep this list to lines that actually occur. `except ImportError`,
# `def __repr__`, `raise DeprecationWarning` and `deprecate` were all here and
# matched nothing in schwaby/ -- the first of those is the one that matters,
# since it would silently drop any future ImportError handler out of coverage.
exclude_lines =
    pragma: no cover
    raise NotImplementedError
